name: Actualizar Radar IA

on:
  schedule:
    - cron: '7 * * * *'   # cada hora
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['public/**', 'scripts/**', 'config/**', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-ia-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Actualizar modelos y noticias
        env:
          # APIs gratuitas (todas opcionales; se usan en este orden y se salta a la siguiente al agotar cuota)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_MODELS: ${{ vars.GROQ_MODELS }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          OPENROUTER_MODELS: ${{ vars.OPENROUTER_MODELS }}
          LLM_DAILY_BUDGET: ${{ vars.LLM_DAILY_BUDGET }}
          # Endpoint propio (de pago u otro), opcional
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          ARTICLES_PER_RUN: ${{ vars.ARTICLES_PER_RUN }}
          SITE_URL: ${{ vars.SITE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Token de Hugging Face de solo lectura (opcional): más cuota y fichas de modelos restringidos
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node scripts/update.mjs

      - name: Guardar datos en el repositorio
        run: |
          git config user.name "radar-ia-bot"
          git config user.email "radar-ia-bot@users.noreply.github.com"
          git add public/data public/feed.xml state
          git diff --cached --quiet || git commit -m "Actualización automática $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash && git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
